server:
  port: 8083

spring:
  application:
    name: detection-api
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: rap_user
    password: rap_password
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  kafka:
    bootstrap-servers: localhost:9092

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.dhananjay.rap: DEBUG
    org.springframework.kafka: WARN
